apiVersion: apps/v1
kind: Deployment
metadata:
  name: plugin-catalog-service
  labels:
    app: plugin-catalog-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: plugin-catalog-service
  template:
    metadata:
      labels:
        app: plugin-catalog-service
    spec:
      initContainers:
        - name: plugin-catalog-migrate
          image: ${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -c
            - "npx sequelize-cli db:migrate"
          env:
            - name: NODE_ENV
              value: "production"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: plugin-catalog-db
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: plugin-catalog-db
                  key: port
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: plugin-catalog-db
                  key: user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: plugin-catalog-db
                  key: password
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: plugin-catalog-db
                  key: name
      containers:
        - name: plugin-catalog-service
          image: ${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}
          ports:
            - containerPort: 3011
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3011"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: plugin-catalog-db
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: plugin-catalog-db
                  key: port
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: plugin-catalog-db
                  key: user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: plugin-catalog-db
                  key: password
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: plugin-catalog-db
                  key: name
            - name: CORS_ORIGIN
              value: "https://steep-geology-napping.ngrok-free.dev"
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: plugin-catalog-rabbitmq
                  key: url
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3011
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 3011
            initialDelaySeconds: 5
            periodSeconds: 10